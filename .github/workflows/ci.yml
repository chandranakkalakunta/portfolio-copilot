name: CI

on:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history helps gitleaks detect secrets in commits on the PR branch
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy core api adapters mcp_servers tests

      - name: Pytest unit + coverage gate
        # Unit only; integration runs in a dedicated job (emulator / fake provider).
        # Ratchet floor: measured ~69% → fail-under 65 (nearest 5% at or below)
        run: uv run pytest -m "not integration" --cov --cov-fail-under=65 --cov-report=term-missing

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Secret scan (gitleaks)
        # Run the binary on the checkout (avoids gitleaks-action PR API permission 403
        # when GITHUB_TOKEN lacks pull_requests:read).
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "beta,cloud-firestore-emulator"

      - name: Start Firestore emulator
        run: |
          set -euo pipefail
          gcloud emulators firestore start --host-port=127.0.0.1:8080 > /tmp/firestore-emulator.log 2>&1 &
          echo $! > /tmp/firestore-emulator.pid
          # Wait until the emulator accepts connections
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:8080/" >/dev/null 2>&1 \
              || nc -z 127.0.0.1 8080 2>/dev/null; then
              echo "Firestore emulator is up (attempt $i)"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "Firestore emulator failed to start"
              cat /tmp/firestore-emulator.log || true
              exit 1
            fi
          done
          echo "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Pytest integration
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_EMULATOR_PROJECT: pcopilot-ci-emulator
        run: uv run pytest -m integration -q

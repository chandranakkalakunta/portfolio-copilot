name: CI

on:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history helps gitleaks detect secrets in commits on the PR branch
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy core api adapters mcp_servers tests

      - name: Pytest with coverage gate
        # Ratchet floor: measured ~69% locally → fail-under 65 (nearest 5% at or below)
        run: uv run pytest --cov --cov-fail-under=65 --cov-report=term-missing

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Deploy Dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: deploy-dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: pcopilot-dev
          workload_identity_provider: projects/552451662981/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-deployer@pcopilot-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          IMAGE="asia-south1-docker.pkg.dev/pcopilot-dev/containers/hello:${GITHUB_SHA}"
          docker build --build-arg BUILD_ID="${GITHUB_SHA}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        run: |
          DEPLOY_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gcloud run deploy hello \
            --image "$IMAGE" \
            --region asia-south1 \
            --project pcopilot-dev \
            --service-account run-app@pcopilot-dev.iam.gserviceaccount.com \
            --set-env-vars "BUILD_ID=${GITHUB_SHA},DEPLOY_TIME=${DEPLOY_TIME}" \
            --quiet
          gcloud run services describe hello --region asia-south1 --project pcopilot-dev --format='value(status.url)'

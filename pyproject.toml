[project]
name = "portfolio-copilot"
version = "0.1.0"
description = "Portfolio Copilot monorepo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.6.3",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "google.adk",
    "google.adk.*",
    "google.genai",
    "google.genai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters"]

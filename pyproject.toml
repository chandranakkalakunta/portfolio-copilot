[project]
name = "portfolio-copilot"
version = "0.1.0"
description = "Portfolio Copilot monorepo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.6.3",
    "google-cloud-firestore>=2.28.1",
    "langchain-core>=1.5.4",
    "langchain-google-vertexai>=3.2.4",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "google.adk",
    "google.adk.*",
    "google.genai",
    "google.genai.*",
    "langgraph",
    "langgraph.*",
    "langchain",
    "langchain.*",
    "langchain_core",
    "langchain_core.*",
    "langchain_google_vertexai",
    "langchain_google_vertexai.*",
    "yfinance",
    "yfinance.*",
    "google.cloud.firestore",
    "google.cloud.firestore.*",
    "google.cloud.firestore_v1",
    "google.cloud.firestore_v1.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``mcp_servers/`` holds local MCP apps; import package remains ``market_data``.
# Named to avoid shadowing the official PyPI ``mcp`` SDK.
pythonpath = [".", "mcp_servers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters"]
